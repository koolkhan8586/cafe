# Cafe LSAF — nginx site config for cafe.khanmusa.com BEHIND CLOUDFLARE.
#
# Use this file when the DNS record is proxied (orange cloud) and you are
# terminating TLS at the origin with a Cloudflare Origin Certificate.
# For a DNS-only (grey cloud) setup with Let's Encrypt, use
# cafe.khanmusa.com.conf instead — do not enable both.
#
# Install:
#   sudo cp deploy/nginx/cafe-proxy.conf /etc/nginx/snippets/
#   sudo /var/www/cafe/deploy/cloudflare/update-cloudflare-ips.sh
#   sudo cp deploy/nginx/cafe.khanmusa.com.cloudflare.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/cafe.khanmusa.com.cloudflare.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare SSL/TLS mode must be "Full (strict)". "Flexible" would leave the
# Cloudflare-to-origin leg unencrypted, which puts session cookies in the clear.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    # Uncomment only if the server has IPv6; otherwise nginx -t fails with
    # "Address family not supported by protocol".
    # listen    [::]:80;
    server_name cafe.khanmusa.com;

    # Cloudflare connects to the origin over 443 in Full (strict) mode, so
    # anything arriving here came direct to the origin IP. Send it to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    # listen    [::]:443 ssl;
    server_name cafe.khanmusa.com;

    # Cloudflare Origin Certificate. Trusted by Cloudflare only, never by a
    # browser directly — that is fine, browsers only ever see Cloudflare's cert.
    ssl_certificate     /etc/ssl/cloudflare/cafe.khanmusa.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/cafe.khanmusa.com.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # No HTTP/2 here on purpose: Cloudflare speaks HTTP/1.1 to origins, so it
    # would buy nothing, and "http2 on" is nginx 1.25+ only while Ubuntu 24.04
    # ships 1.24.
    #
    # Rewrites $remote_addr from Cloudflare's edge IP to the real visitor, so
    # access logs are useful. Generated — run update-cloudflare-ips.sh first.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # Origin lockdown (recommended, enable AFTER the site is confirmed working).
    # Stops anyone who discovers the origin IP from bypassing Cloudflare with a
    # forged Host header. Turn on Authenticated Origin Pulls in the Cloudflare
    # dashboard, fetch their CA, then uncomment both lines:
    #
    #   sudo curl -fsS -o /etc/ssl/cloudflare/origin-pull-ca.pem \
    #     https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
    #
    # ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    # ssl_verify_client on;
    #
    # Do NOT instead add an allow/deny list of Cloudflare ranges here. nginx
    # evaluates allow/deny against $remote_addr AFTER the realip module above
    # has rewritten it to the visitor's IP, so a Cloudflare-only allow-list
    # rejects every genuine visitor and takes the site down.

    client_max_body_size 2m;

    access_log /var/log/nginx/cafe-access.log;
    error_log  /var/log/nginx/cafe-error.log;

    # No special handling for /_next/static: Next.js already serves fingerprinted
    # assets with "Cache-Control: public, max-age=31536000, immutable".
    location / {
        include /etc/nginx/snippets/cafe-proxy.conf;
    }
}
