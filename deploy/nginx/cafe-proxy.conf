# Shared reverse-proxy settings for the Cafe LSAF app.
# Included by the site config so the HTTP and HTTPS blocks stay identical.

# Must match PORT in .env (nginx cannot read that file).
proxy_pass         http://127.0.0.1:3003;
proxy_http_version 1.1;

# Required for the app to know it is behind TLS: the session cookie is set
# with the Secure flag in production, and redirects must come back as https.
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   X-Forwarded-Host  $host;

# Next.js uses these for HMR in dev and for streamed responses in production.
proxy_set_header   Upgrade    $http_upgrade;
proxy_set_header   Connection $connection_upgrade;

proxy_read_timeout 60s;
proxy_send_timeout 60s;

# Let the app control its own caching headers.
proxy_buffering    off;
