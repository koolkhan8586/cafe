# Cafe LSAF — nginx site config for cafe.khanammad.com
#
# Install:
#   sudo cp deploy/nginx/cafe-proxy.conf            /etc/nginx/snippets/
#   sudo cp deploy/nginx/cafe.khanammad.com.conf    /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/cafe.khanammad.com.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot, which rewrites this file in place to add the TLS block and
# the http -> https redirect:
#   sudo certbot --nginx -d cafe.khanammad.com
#
# Start with this HTTP-only version. Certbot needs port 80 reachable to prove
# you control the domain, so do not add a redirect by hand before running it.

# Needed by the Upgrade/Connection headers in the proxy snippet: maps to
# "upgrade" for websocket requests and "close" otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    # Uncomment if the server has IPv6 and the domain has an AAAA record.
    # On a host without IPv6 this line makes `nginx -t` fail with
    # "Address family not supported by protocol".
    # listen    [::]:80;
    server_name cafe.khanammad.com;

    # Uploads are small (no images are stored yet), but menu edits post JSON.
    client_max_body_size 2m;

    access_log /var/log/nginx/cafe-access.log;
    error_log  /var/log/nginx/cafe-error.log;

    # No special handling for /_next/static: Next.js already serves fingerprinted
    # assets with "Cache-Control: public, max-age=31536000, immutable", and
    # adding it here only produces a duplicate header.
    location / {
        include /etc/nginx/snippets/cafe-proxy.conf;
    }
}
